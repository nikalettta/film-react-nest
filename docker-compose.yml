services:
  postgres:
    image: postgres:16-alpine
    container_name: film-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: film-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app-network
    depends_on:
      - postgres

  backend:
    build: ./backend
    image: ghcr.io/nikalettta/film-react-nest-backend:latest
    container_name: film-backend
    restart: unless-stopped
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      LOGGER: ${LOGGER:-json}
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: ghcr.io/nikalettta/film-react-nest-frontend:latest
    container_name: film-frontend
    restart: "no"
    volumes:
      - frontend_dist:/dist

  nginx:
    build: ./nginx
    image: ghcr.io/nikalettta/film-react-nest-nginx:latest
    container_name: film-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  frontend_dist: