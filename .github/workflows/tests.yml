name: Tests 14 sprint

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
env:
  DIR_TESTS: /tmp/tests-back-to-the-film
  REP_TESTS: https://github.com/Yandex-Practicum/tests-back-to-the-film.git
jobs:
  test_backend:
    runs-on: ubuntu-latest
    steps:
    - name: Set up GitHub Actions
      uses: actions/checkout@v4
    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
    - name: Get testing lib
      run: set -eu && git clone --depth 1 $REP_TESTS $DIR_TESTS
    - name: Run tests
      run: bash $DIR_TESTS/bin/backend.sh
  test_endpoints:
    runs-on: ubuntu-latest
    env:
      DATABASE_DRIVER: postgres
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: exampledb
      DATABASE_USERNAME: exampleuser
      DATABASE_PASSWORD: examplepass
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: exampleuser
          POSTGRES_PASSWORD: examplepass
          POSTGRES_DB: exampledb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exampleuser -d exampledb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - name: Set up GitHub Actions
      uses: actions/checkout@v4
    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
    - name: Get testing lib
      run: set -eu && git clone --depth 1 $REP_TESTS $DIR_TESTS
    - name: Load test data
      run: |
        sudo apt-get update && sudo apt-get install -y postgresql-client
        export PGPASSWORD=examplepass
        psql -h 127.0.0.1 -U exampleuser -d exampledb -f backend/test/prac.init.sql
        psql -h 127.0.0.1 -U exampleuser -d exampledb -f backend/test/prac.films.sql
        psql -h 127.0.0.1 -U exampleuser -d exampledb -f backend/test/prac.shedules.sql
    - name: Start project
      run: bash $DIR_TESTS/bin/start_project.sh
    - name: Run tests
      run: bash $DIR_TESTS/bin/endpoints.sh
      